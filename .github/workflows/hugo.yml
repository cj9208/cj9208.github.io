name: Deploy Hugo site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.164.0'
        extended: true

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install npm
      run: npm ci

    - name: Build
      run: hugo --minify

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public

    - name: Inspect and cancel stale Pages deployments
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "== Pages deployments =="
        curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/pages/deployments" \
          | jq -r '.[] | "\(.id) \(.status) \(.updated_at)"'
        echo "== Canceling queued/in_progress =="
        curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/pages/deployments" \
          | jq -r '.[] | select(.status == "queued" or .status == "in_progress") | .id' \
          | while read -r id; do
              [ -n "$id" ] || continue
              echo "cancel $id"
              curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$id/cancel"
            done
        exit 0

    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4