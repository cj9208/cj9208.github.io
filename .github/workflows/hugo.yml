name: Deploy Hugo site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.164.0'
        extended: true

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install npm
      run: npm ci

    - name: Build
      run: hugo --minify

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public

    - name: Cancel stale Pages deployments
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ids=$(gh api "repos/${{ github.repository }}/pages/deployments" \
          --jq '.[] | select(.status == "queued" or .status == "in_progress") | .id')
        if [ -n "$ids" ]; then
          echo "$ids" | while read -r id; do
            echo "Canceling stale Pages deployment $id"
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$id/cancel" >/dev/null \
              || echo "cancel failed for $id"
          done
        else
          echo "No stale Pages deployments to cancel"
        fi

    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4